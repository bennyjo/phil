name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    name: Integrity tripwires
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Config, caps, ledger and Python sources are sane
        run: python3 core/validate.py
      - name: Runner lease excludes two simulated runners (local bare remote)
        run: python3 core/test_lease.py -v
      - name: Real settle fails closed without live positions (stubbed, offline)
        run: python3 core/test_real.py -v
      - name: Monthly screener log and journal size tripwire (offline)
        run: python3 core/test_screener_log.py -v
      - name: Each FULL or TRIGGERED forecast lands in one core-opened funnel row (offline)
        run: python3 core/test_funnel.py -v
      - name: Scan skips markets without usable token ids, e.g. Protocol V2 (offline)
        run: python3 core/test_token_ids.py -v
      - name: Touch replay reads prices as_of only and scores on a fixed fixture (offline)
        run: python3 core/test_touch_replay.py -v
      - name: Headline Arena adapter sends only daily-question vectors (offline)
        run: python3 core/test_headline_arena.py -v
      - name: Paired rule test, placeholder exclusion, rule-tagged records (offline)
        run: python3 core/test_rules.py -v
      - name: Paper fills pay fees, respect order minimums, void pays $0.50 (offline)
        run: python3 core/test_fills.py -v
      - name: Score report parses the real ledger (offline)
        run: python3 core/score.py --json --skip-mtm > /dev/null
      - name: Lint — bug-class rules only (syntax errors, undefined names)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F core strategy

  boundary:
    name: Agent/operator boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No agent commit touches operator-owned files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: bash .github/scripts/boundary.sh "$BEFORE" "$AFTER"
